name: Correction
description: Report an error in an existing entry (wrong message, wrong cause, fix that doesn't work)
labels: ["correction"]
body:
  - type: input
    id: code
    attributes:
      label: Error code
      description: Which entry is wrong?
      placeholder: "accounts:4"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: What's wrong?
      options:
        - Wrong displayed message
        - Wrong or missing cause
        - Fix step doesn't work
        - Fix step is incomplete
        - Cause chain is incorrect
        - Severity is wrong
        - Other
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current (wrong) content
      description: Copy the text that's incorrect
    validations:
      required: true

  - type: textarea
    id: correct
    attributes:
      label: Correct content
      description: What it should say instead
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Verified on
      description: OS and Spotify version where you confirmed the correction
      placeholder: "Windows 11 23H2 / Spotify 1.2.x"
    validations:
      required: false
